<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peer-to-Peer Accelerometer Streamer</title>
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- PeerJS Cloud Library -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; text-align: center; max-width: 400px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    #qrcode { background: #fff; padding: 10px; border-radius: 6px; display: inline-block; margin: 15px 0; }
    button { background: #38bdf8; color: #000; font-weight: bold; border: none; padding: 14px 20px; border-radius: 8px; font-size: 1rem; cursor: pointer; width: 100%; margin-top: 10px; }
    .metric { font-family: monospace; font-size: 1.4rem; margin: 8px 0; display: flex; justify-content: space-between; background: #0f172a; padding: 8px 12px; border-radius: 6px; }
    .status { font-weight: bold; padding: 4px 8px; border-radius: 4px; display: inline-block; font-size: 0.85rem; }
    .connected { background: #166534; color: #4ade80; }
    .waiting { background: #854d0e; color: #fef08a; }
    .error { background: #991b1b; color: #fca5a5; }
  </style>
</head>
<body>

<div class="card">
  <!-- HOST VIEW (PC) -->
  <div id="hostView">
    <h2>Desktop Sensor Receiver</h2>
    <p>Scan with your Android phone:</p>
    <div id="qrcode"></div>
    <p>Status: <span id="hostStatus" class="status waiting">Initializing Peer...</span></p>
    <div class="metric"><span>X:</span> <span id="valX">0.00</span></div>
    <div class="metric"><span>Y:</span> <span id="valY">0.00</span></div>
    <div class="metric"><span>Z:</span> <span id="valZ">0.00</span></div>
  </div>

  <!-- CLIENT VIEW (MOBILE) -->
  <div id="clientView" style="display: none;">
    <h2>Mobile Motion Sender</h2>
    <p>Status: <span id="clientStatus" class="status waiting">Ready to Connect</span></p>
    <button id="startBtn">Start Streaming</button>
    <div style="margin-top:20px;">
      <div class="metric"><span>X:</span> <span id="mobileX">0.00</span></div>
      <div class="metric"><span>Y:</span> <span id="mobileY">0.00</span></div>
      <div class="metric"><span>Z:</span> <span id="mobileZ">0.00</span></div>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const targetPeerId = params.get('peer');
  let peer, connection;

  // Explicit PeerJS cloud configuration options for reliable secure handshakes
  const peerConfig = {
    host: '0.peerjs.com',
    port: 443,
    secure: true,
    debug: 2
  };

  if (!targetPeerId) {
    initHost();
  } else {
    initClient(targetPeerId);
  }

  function initHost() {
    const hostId = 'sensor-host-' + Math.random().toString(36).substring(2, 8);
    peer = new Peer(hostId, peerConfig);

    peer.on('open', (id) => {
      const clientURL = `${window.location.href.split('?')[0]}?peer=${id}`;
      new QRCode(document.getElementById("qrcode"), { text: clientURL, width: 160, height: 160 });
      
      const hostStatus = document.getElementById('hostStatus');
      hostStatus.className = "status waiting";
      hostStatus.innerText = "Waiting for phone scan...";
    });

    peer.on('error', (err) => {
      console.error("PeerJS Host Error:", err);
      const hostStatus = document.getElementById('hostStatus');
      hostStatus.className = "status error";
      hostStatus.innerText = "Error: " + err.type;
    });

    peer.on('connection', (conn) => {
      connection = conn;
      
      connection.on('open', () => {
        const hostStatus = document.getElementById('hostStatus');
        hostStatus.className = "status connected";
        hostStatus.innerText = "Streaming Active";
      });

      connection.on('data', (data) => {
        document.getElementById('valX').innerText = data.x;
        document.getElementById('valY').innerText = data.y;
        document.getElementById('valZ').innerText = data.z;
      });

      connection.on('close', () => {
        const hostStatus = document.getElementById('hostStatus');
        hostStatus.className = "status waiting";
        hostStatus.innerText = "Disconnected";
      });
    });
  }

  function initClient(hostId) {
    document.getElementById('hostView').style.display = 'none';
    document.getElementById('clientView').style.display = 'block';

    const startBtn = document.getElementById('startBtn');
    startBtn.addEventListener('click', async () => {
      if (typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          const res = await DeviceMotionEvent.requestPermission();
          if (res !== 'granted') { alert('Sensor permission denied'); return; }
        } catch(e) { console.error(e); }
      }

      startBtn.disabled = true;
      startBtn.innerText = "Connecting to PC...";
      
      const clientStatus = document.getElementById('clientStatus');

      peer = new Peer(peerConfig);

      peer.on('open', () => {
        connection = peer.connect(hostId);

        connection.on('open', () => {
          clientStatus.className = "status connected";
          clientStatus.innerText = "Live";
          startBtn.innerText = "Streaming Motion...";
          
          window.addEventListener('devicemotion', handleMotion);
        });

        connection.on('error', (err) => {
          console.error("Connection error:", err);
          clientStatus.className = "status error";
          clientStatus.innerText = "Connection Failed";
          startBtn.disabled = false;
          startBtn.innerText = "Retry Connection";
        });
      });

      peer.on('error', (err) => {
        console.error("PeerJS Client Error:", err);
        clientStatus.className = "status error";
        clientStatus.innerText = "Peer Error: " + err.type;
        startBtn.disabled = false;
        startBtn.innerText = "Retry Connection";
      });
    });
  }

  function handleMotion(event) {
    const acc = event.accelerationIncludingGravity || event.acceleration;
    if (!acc) return;
    const data = {
      x: parseFloat((acc.x || 0).toFixed(2)),
      y: parseFloat((acc.y || 0).toFixed(2)),
      z: parseFloat((acc.z || 0).toFixed(2))
    };
    
    document.getElementById('mobileX').innerText = data.x;
    document.getElementById('mobileY').innerText = data.y;
    document.getElementById('mobileZ').innerText = data.z;

    if (connection && connection.open) {
      connection.send(data);
    }
  }
</script>
</body>
</html>
